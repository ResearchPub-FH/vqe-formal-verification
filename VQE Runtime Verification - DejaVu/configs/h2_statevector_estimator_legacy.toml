schema_version = 1
hamiltonian = "../data/h2_hamiltonian.json"

[execution]
mode = "qiskit-statevector"
system = "h2"
backend = "StatevectorEstimator"
parameter_count = 4
max_iterations = 60
shots_per_term = 0
shot_budget = 0
seed = 7
optimizer_protocol = "opaque"
# SciPy may terminate on its own status before the external VQE limit.
# This explicitly enables that project extension to the manuscript lifecycle.
allow_optimizer_stopped = true

[numeric]
parameter_lower = -3.141592653589793
parameter_upper = 3.141592653589793
energy_abs_tolerance = 1e-9
expectation_abs_tolerance = 1e-9

[convergence]
tolerance = 0.01
min_iterations = 1
patience = 1

[observability]
require_raw_counts = false

[monitor]
timeout_seconds = 10.0
bits_per_variable = 24
