schema_version = 1
hamiltonian = "../data/h2_hamiltonian.json"

[execution]
mode = "qiskit-runtime"
system = "h2"
backend = "ibm_marrakesh"
parameter_count = 4
max_iterations = 50
shots_per_term = 4096
shot_budget = 819200
seed = 7
optimizer_protocol = "opaque"
# SciPy may terminate on its own status before the external VQE limit.
# This explicitly enables that project extension to the manuscript lifecycle.
allow_optimizer_stopped = true

[numeric]
parameter_lower = -3.141592653589793
parameter_upper = 3.141592653589793
energy_abs_tolerance = 1e-6
expectation_abs_tolerance = 1e-6

[convergence]
tolerance = 0.01
min_iterations = 1
patience = 1

[observability]
# EstimatorV2 reports expectation values rather than raw bitstring histograms.
# Requested shots are not counted as executed evidence unless the result
# exposes actual shot or count metadata.
require_raw_counts = false

[monitor]
timeout_seconds = 30.0
bits_per_variable = 24
